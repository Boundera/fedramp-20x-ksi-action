name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build + SBOM tooling
        run: |
          python -m pip install --upgrade pip
          pip install build cyclonedx-bom

      - name: Build sdist + wheel
        run: python -m build

      - name: Generate CycloneDX SBOM
        run: |
          pip install .
          cyclonedx-py environment --output-format json --outfile sbom.cyclonedx.json || \
          cyclonedx-py --format json -o sbom.cyclonedx.json || true

      - name: Verify tag matches action version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          echo "Releasing $TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*
            sbom.cyclonedx.json

  # Move the major-version tag (v0) to this release so `@v0` consumers update.
  move-major-tag:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move major tag
        run: |
          MAJOR="$(echo "${GITHUB_REF_NAME}" | cut -d. -f1)"   # v0
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "$MAJOR" "${GITHUB_REF_NAME}"
          git push -f origin "$MAJOR"
