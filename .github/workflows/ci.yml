name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy src/fedramp_ksi || true   # warnings only for now; tighten later

      - name: COVERAGE.md in sync with the registry
        run: python tools/gen_coverage_doc.py --check

      - name: Pytest (engine ≥90% coverage gate)
        run: |
          pytest -v \
            --cov=fedramp_ksi \
            --cov-report=term-missing \
            --cov-fail-under=90

  gate-demo:
    # Dogfood: prove the gate blocks a violating plan and passes a clean one.
    runs-on: ubuntu-latest
    needs: lint-test
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4

      - name: Compliant plan should PASS (exit 0)
        uses: ./
        with:
          plan_json: tests/fixtures/aws/cna-rnt/compliant.json
          ksi_ids: KSI-CNA-RNT
          post_check_run: 'false'
          comment_on_pr: 'false'

      - name: Violating plan should BLOCK (expect failure)
        id: violate
        continue-on-error: true
        uses: ./
        with:
          plan_json: tests/fixtures/aws/cna-rnt/violating.json
          ksi_ids: KSI-CNA-RNT
          post_check_run: 'false'
          comment_on_pr: 'false'

      - name: Assert the violating plan blocked
        run: |
          if [ "${{ steps.violate.outcome }}" != "failure" ]; then
            echo "::error::Expected the violating plan to block the gate, but it did not."
            exit 1
          fi
          echo "Gate correctly blocked the violating plan."
