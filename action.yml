name: 'FedRAMP 20x KSI Gate'
description: >-
  Preventive policy-as-code gate: evaluate a Terraform plan against FedRAMP 20x
  Key Security Indicators and block changes that would create non-compliant
  cloud state (AWS/Azure/GCP). Emits SARIF, a signed evidence pack, and a commit
  Check Run. No vendor server in the loop.
author: 'Boundera'

branding:
  icon: 'shield'
  color: 'blue'

inputs:
  plan_json:
    description: 'Path to `terraform show -json` output. Primary, credential-free mode.'
    required: false
    default: ''
  terraform_dir:
    description: 'Directory to run init+plan+show -json inside the action (needs read-only cloud creds). Fallback mode.'
    required: false
    default: ''
  root_paths:
    description: 'Comma-separated roots for multi-root/monorepo scanning.'
    required: false
    default: '.'
  providers:
    description: '`auto` or a subset of `aws,azure,gcp`.'
    required: false
    default: 'auto'
  target_class:
    description: 'FedRAMP 20x class A|B|C. Selects required vs optional KSIs.'
    required: false
    default: 'C'
  fail_on:
    description: '`enforce` (fail on any unwaived enforced FAIL), `severity:<level>`, or `none` (report-only).'
    required: false
    default: 'enforce'
  min_severity:
    description: 'Floor for reporting findings (low|medium|high|critical).'
    required: false
    default: 'low'
  waivers_file:
    description: 'Path to the waivers file.'
    required: false
    default: '.fedramp-ksi-waivers.yml'
  baseline_file:
    description: 'Optional suppression baseline for legacy debt.'
    required: false
    default: ''
  ksi_ids:
    description: 'Restrict to a subset of KSI IDs; empty = all in-class. Legacy IDs auto-mapped.'
    required: false
    default: ''
  ruleset_version:
    description: 'Pin a specific KSI ruleset version (defaults to bundled).'
    required: false
    default: ''
  post_check_run:
    description: 'Post a commit Check Run via GITHUB_TOKEN.'
    required: false
    default: 'true'
  comment_on_pr:
    description: 'Post/refresh a single PR summary comment.'
    required: false
    default: 'true'
  sarif_output:
    description: 'SARIF file path (uploadable to code scanning).'
    required: false
    default: 'fedramp-ksi.sarif'
  output_dir:
    description: 'Evidence + manifest output dir.'
    required: false
    default: '.fedramp-evidence'
  evidence_retention_days:
    description: 'Artifact retention (days).'
    required: false
    default: '90'
  python_version:
    description: 'Python version for the action runtime.'
    required: false
    default: '3.11'
  terraform_version:
    description: 'Terraform version to install (only needed for terraform_dir mode).'
    required: false
    default: ''

outputs:
  status:
    description: 'Worst status across the enforce-set: PASS/FAIL/ERROR.'
    value: ${{ steps.evaluate.outputs.status }}
  advisory_status:
    description: 'Worst status across advisory checks.'
    value: ${{ steps.evaluate.outputs.advisory_status }}
  findings_count:
    description: 'JSON: {critical,high,medium,low}.'
    value: ${{ steps.evaluate.outputs.findings_count }}
  enforced_failures:
    description: 'Count of unwaived enforced FAILs (the gate-blocking number).'
    value: ${{ steps.evaluate.outputs.enforced_failures }}
  sarif_path:
    description: 'Path to the emitted SARIF file.'
    value: ${{ steps.evaluate.outputs.sarif_path }}
  manifest_path:
    description: 'Path to the evidence manifest.'
    value: ${{ steps.evaluate.outputs.manifest_path }}
  evidence_dir:
    description: 'Evidence pack directory.'
    value: ${{ steps.evaluate.outputs.evidence_dir }}
  check_run_ids:
    description: 'JSON array of created Check Run IDs.'
    value: ${{ steps.evaluate.outputs.check_run_ids }}
  summary:
    description: 'Markdown summary (also written to $GITHUB_STEP_SUMMARY).'
    value: ${{ steps.evaluate.outputs.summary }}

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python_version }}

    - name: Install Terraform (terraform_dir mode only)
      if: inputs.terraform_dir != '' && inputs.terraform_version != ''
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ inputs.terraform_version }}

    - name: Install runtime dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install "PyYAML>=6.0"

    - name: Run FedRAMP 20x KSI gate
      id: evaluate
      shell: bash
      env:
        INPUT_PLAN_JSON: ${{ inputs.plan_json }}
        INPUT_TERRAFORM_DIR: ${{ inputs.terraform_dir }}
        INPUT_ROOT_PATHS: ${{ inputs.root_paths }}
        INPUT_PROVIDERS: ${{ inputs.providers }}
        INPUT_TARGET_CLASS: ${{ inputs.target_class }}
        INPUT_FAIL_ON: ${{ inputs.fail_on }}
        INPUT_MIN_SEVERITY: ${{ inputs.min_severity }}
        INPUT_WAIVERS_FILE: ${{ inputs.waivers_file }}
        INPUT_BASELINE_FILE: ${{ inputs.baseline_file }}
        INPUT_KSI_IDS: ${{ inputs.ksi_ids }}
        INPUT_POST_CHECK_RUN: ${{ inputs.post_check_run }}
        INPUT_COMMENT_ON_PR: ${{ inputs.comment_on_pr }}
        INPUT_SARIF_OUTPUT: ${{ inputs.sarif_output }}
        INPUT_OUTPUT_DIR: ${{ inputs.output_dir }}
        GITHUB_TOKEN: ${{ github.token }}
        KSI_RULESET_DIR: ${{ github.action_path }}/data/ruleset
        KSI_ACTION_VERSION: '0.2.0'
        PYTHONPATH: ${{ github.action_path }}/src
      run: |
        python -m fedramp_ksi.app

    - name: Upload evidence pack
      if: always() && steps.evaluate.outputs.evidence_dir != ''
      uses: actions/upload-artifact@v4
      with:
        name: fedramp-ksi-evidence
        path: ${{ steps.evaluate.outputs.evidence_dir }}
        retention-days: ${{ inputs.evidence_retention_days }}
        if-no-files-found: warn
